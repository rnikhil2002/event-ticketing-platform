name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and run all service tests
        run: mvn -B verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build

  # Runs only on main and only once AWS is set up (repo variable AWS_DEPLOY=true,
  # secret AWS_ROLE_ARN for GitHub OIDC). Pushes images to ECR and rolls the ECS services.
  deploy:
    if: github.ref == 'refs/heads/main' && vars.AWS_DEPLOY == 'true'
    runs-on: ubuntu-latest
    needs: [images]
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      PREFIX: ticketing-${{ vars.ENV_NAME || 'dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push images
        run: |
          for svc in user event booking; do
            img=${{ steps.ecr.outputs.registry }}/$PREFIX-$svc
            docker build -f $svc-service/Dockerfile -t $img:${{ github.sha }} -t $img:latest .
            docker push --all-tags $img
          done
          img=${{ steps.ecr.outputs.registry }}/$PREFIX-gateway
          docker build -f gateway/Dockerfile -t $img:${{ github.sha }} -t $img:latest .
          docker push --all-tags $img
      - name: Roll out new version
        run: |
          for svc in user event booking gateway; do
            aws ecs update-service --cluster $PREFIX --service $svc --force-new-deployment > /dev/null
          done
          aws ecs wait services-stable --cluster $PREFIX --services user event booking gateway
