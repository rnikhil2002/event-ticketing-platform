server:
  port: ${PORT:8083}

spring:
  application:
    name: booking-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bookings}
    username: ${DB_USER:ticketing}
    password: ${DB_PASSWORD:ticketing}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  data:
    redis:
      repositories:
        enabled: false
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

app:
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-that-is-at-least-32-bytes-long}
  event-service-url: ${EVENT_SERVICE_URL:http://localhost:8082}
  hold-minutes: ${HOLD_MINUTES:5}
  seat-lock:
    store: ${SEAT_LOCK_STORE:redis}

management:
  endpoints:
    web:
      exposure:
        include: health,info
