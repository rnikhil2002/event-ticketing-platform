# Single entry point: serves the React app and routes each API path to its service.
server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/users/    { proxy_pass http://user-service:8080; }
  location /api/events    { proxy_pass http://event-service:8080; }
  location /api/bookings/ { proxy_pass http://booking-service:8080; }

  location / {
    try_files $uri /index.html;
  }
}
